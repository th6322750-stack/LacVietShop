name: Rebuild validated hero assets

on:
  push:
    branches:
      - design/hero-assets-v2
    paths:
      - tmp/hero-upload/READY

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/hero-assets-v2
          fetch-depth: 0

      - name: Decode and verify exact WebP payloads
        shell: python
        run: |
          import base64, hashlib
          from pathlib import Path

          root = Path('.')
          specs = {
              'bird': ('hero-bird-main.webp', 10968, 'f21172603ae86a2769c76a763e016edb6854281735b6f4813801ecacfd3ecd77'),
              'dongson': ('hero-dongson-bg.webp', 8074, 'e26f3247db3a925b5daa662ea42a207b424461d69a9eb5ee435df237cd90380f'),
              'wave': ('hero-wave-gold.webp', 9220, 'c776b908956e5ce5805a63965bd8fa01aff666cc7581da18999004ffba57e3f2'),
              'sparkles': ('hero-sparkles.webp', 7868, '76706bbfa698792bd344c0a659e1aac30aebc61823b8123b4d4cdc2b67615883'),
          }
          out_dir = root / 'public/assets/decor/hero'
          out_dir.mkdir(parents=True, exist_ok=True)

          for key, (filename, expected_size, expected_sha256) in specs.items():
              encoded = (root / f'tmp/hero-upload/{key}.base64').read_text(encoding='utf-8').strip()
              data = base64.b64decode(encoded, validate=True)
              assert len(data) == expected_size, (key, len(data), expected_size)
              assert data[:4] == b'RIFF', (key, data[:12].hex())
              assert data[8:12] == b'WEBP', (key, data[:12].hex())
              actual_sha256 = hashlib.sha256(data).hexdigest()
              assert actual_sha256 == expected_sha256, (key, actual_sha256, expected_sha256)
              (out_dir / filename).write_bytes(data)
              print(f'PASS {filename}: {len(data)} bytes sha256={actual_sha256}')

      - name: Remove corrupt pack and temporary payloads
        shell: bash
        run: |
          rm -f references/asset-packs/LacVietShop-hero-right-assets-v2.zip
          rm -rf tmp/hero-upload
          rm -f tmp/test.txt

      - name: Commit validated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/assets/decor/hero references/asset-packs tmp/hero-upload tmp/test.txt || true
          git commit -m "Replace corrupt hero assets with validated WebP files"
          git push origin HEAD:design/hero-assets-v2
